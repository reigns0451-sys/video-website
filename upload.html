<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Video - VidzHub</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .upload-page {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .upload-box {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .upload-box h1 {
            margin-bottom: 8px;
        }

        .upload-box .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .file-area {
            border: 2px dashed #ccc;
            border-radius: 15px;
            padding: 35px 20px;
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .file-area:hover {
            border-color: #ff1744;
        }

        .file-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .file-area input {
            margin-top: 15px;
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        .preview {
            display: none;
            margin-bottom: 20px;
        }

        .preview video {
            width: 100%;
            max-height: 350px;
            border-radius: 12px;
            background: #000;
        }

        .publish-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #ff1744;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .publish-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .upload-box {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <span>▶</span> VidzHub
        </div>

        <button class="upload-btn" onclick="window.location.href='index.html'">
            Home
        </button>

    </header>


    <!-- UPLOAD PAGE -->
    <main class="upload-page">

        <div class="upload-box">

            <h1>Upload Your Video 🎥</h1>

            <p class="subtitle">
                Share your video with the VidzHub community.
            </p>


            <!-- VIDEO SELECT -->
            <div class="file-area">

                <div class="file-icon">📹</div>

                <h3>Select a video</h3>

                <p>MP4, WebM or MOV</p>

                <input
                    type="file"
                    id="videoFile"
                    accept="video/*"
                >

            </div>


            <!-- VIDEO PREVIEW -->
            <div class="preview" id="preview">

                <video id="videoPreview" controls></video>

            </div>


            <!-- TITLE -->
            <div class="form-group">

                <label for="title">
                    Video Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter video title"
                >

            </div>


            <!-- DESCRIPTION -->
            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Write something about your video..."
                ></textarea>

            </div>


            <!-- PUBLISH -->
            <button
                class="publish-btn"
                id="publishBtn"
            >
                Publish Video
            </button>

        </div>

    </main>


    <script>

        const videoFile = document.getElementById("videoFile");
        const preview = document.getElementById("preview");
        const videoPreview = document.getElementById("videoPreview");
        const publishBtn = document.getElementById("publishBtn");


        // Video preview
        videoFile.addEventListener("change", function () {

            const file = this.files[0];

            if (file) {

                const videoURL = URL.createObjectURL(file);

                videoPreview.src = videoURL;

                preview.style.display = "block";
            }

        });


        // Publish button
        publishBtn.addEventListener("click", function () {

            const title = document.getElementById("title").value.trim();
            const file = videoFile.files[0];

            if (!file) {
                alert("Please select a video.");
                return;
            }

            if (!title) {
                alert("Please enter a video title.");
                return;
            }

            alert(
                "Video selected successfully! 🚀\n\n" +
                "Real online upload system will be connected next."
            );

        });

    </script>

</body>
</html>
